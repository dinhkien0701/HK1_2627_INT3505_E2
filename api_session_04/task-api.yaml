openapi: 3.0.3

info:
  title: Tasks API
  version: 1.0.0
  description: |
    API quản lý task nội bộ.
    Hỗ trợ CRUD cơ bản: liệt kê, tạo, lấy chi tiết, cập nhật một phần, xoá.
  contact:
    name: API Team
    email: api@example.vn
  license:
    name: Proprietary

servers:
  - url: http://localhost:5000/v1
    description: Local development
  - url: https://api.example.vn/v1
    description: Production

tags:
  - name: tasks
    description: Quản lý task nội bộ

security:
  - bearerAuth: []

paths:
  /tasks:
    get:
      tags: [tasks]
      summary: Liệt kê danh sách task
      description: |
        Trả về danh sách task có phân trang.
        Mặc định sắp xếp theo `createdAt` giảm dần.
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          $ref: '#/components/responses/TaskPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        'default':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [tasks]
      summary: Tạo task mới
      description: Tạo một task mới cho user hiện tại.
      operationId: createTask
      requestBody:
        $ref: '#/components/requestBodies/CreateTaskBody'
      responses:
        '201':
          description: Tạo thành công
          headers:
            Location:
              description: URL của task vừa tạo
              schema:
                type: string
                format: uri
                example: /v1/tasks/3fa85f64-5717-4562-b3fc-2c963f66afa6
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'

    get:
      tags: [tasks]
      summary: Lấy chi tiết task theo ID
      operationId: getTaskById
      responses:
        '200':
          description: Thông tin task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [tasks]
      summary: Cập nhật một phần task
      description: |
        Chỉ các field được gửi lên mới được cập nhật.
        Field `id` và `createdAt` không thể thay đổi.
      operationId: patchTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInput'
            example:
              status: done
              priority: high
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [tasks]
      summary: Xoá task
      operationId: deleteTask
      responses:
        '204':
          description: Xoá thành công (không có body)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Gửi kèm header `Authorization: Bearer <JWT>`.
        Swagger UI sẽ hiển thị nút **Authorize** ở góc phải.

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      description: UUID của task
      schema:
        type: string
        format: uuid
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    PageLimit:
      name: limit
      in: query
      required: false
      description: Số item tối đa trả về trong một trang
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20

    PageOffset:
      name: offset
      in: query
      required: false
      description: Số item bỏ qua (bắt đầu từ 0)
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0

    StatusFilter:
      name: status
      in: query
      required: false
      description: Lọc theo trạng thái
      schema:
        type: string
        enum: [open, done]
        example: open

  requestBodies:
    CreateTaskBody:
      required: true
      description: Payload tạo task mới
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateTaskInput'
          example:
            title: "Họp nhóm API team"
            priority: high
            dueDate: "2026-09-15"
            assigneeId: "9c8a7f64-5717-4562-b3fc-2c963f66afa6"

  responses:
    TaskPageResponse:
      description: Danh sách task có phân trang
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskPage'
          example:
            items:
              - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                title: "Họp nhóm API team"
                status: open
                priority: high
                dueDate: "2026-09-15"
                assigneeId: "9c8a7f64-5717-4562-b3fc-2c963f66afa6"
                createdAt: "2026-08-26T08:30:00Z"
            total: 1
            limit: 20
            offset: 0

    BadRequest:
      description: Request không hợp lệ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Chưa xác thực hoặc token không hợp lệ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Không tìm thấy resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Dữ liệu gửi lên không vượt qua validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: Lỗi không mong đợi từ server
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Task:
      type: object
      description: Một task đầy đủ
      required: [id, title, status, priority, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "Họp nhóm API team"
        status:
          type: string
          enum: [open, done]
          default: open
          example: open
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
          example: high
        dueDate:
          type: string
          format: date
          nullable: true
          example: "2026-09-15"
        assigneeId:
          type: string
          format: uuid
          nullable: true
          example: "9c8a7f64-5717-4562-b3fc-2c963f66afa6"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-08-26T08:30:00Z"

    CreateTaskInput:
      type: object
      description: Payload để tạo task mới
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "Họp nhóm API team"
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
          example: high
        dueDate:
          type: string
          format: date
          nullable: true
          example: "2026-09-15"
        assigneeId:
          type: string
          format: uuid
          nullable: true
          example: "9c8a7f64-5717-4562-b3fc-2c963f66afa6"

    UpdateTaskInput:
      type: object
      description: |
        Payload PATCH — chỉ các field gửi lên mới được cập nhật.
        Tất cả field đều optional, nhưng phải có ít nhất 1 field.
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "Họp nhóm API team (đổi tên)"
        status:
          type: string
          enum: [open, done]
          example: done
        priority:
          type: string
          enum: [low, normal, high]
          example: high
        dueDate:
          type: string
          format: date
          nullable: true
          example: "2026-09-20"
        assigneeId:
          type: string
          format: uuid
          nullable: true
          example: "9c8a7f64-5717-4562-b3fc-2c963f66afa6"

    TaskPage:
      type: object
      description: Trang kết quả danh sách task
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer
          minimum: 0
          description: Tổng số task khớp filter (không phụ thuộc limit/offset)
          example: 42
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    Error:
      type: object
      description: Lỗi theo chuẩn RFC 7807 (Problem Details)
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          example: "https://api.example.vn/errors/task-not-found"
        title:
          type: string
          example: "Task not found"
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "task 42 thuộc user khác"
        instance:
          type: string
          format: uri
          example: "/v1/tasks/42"